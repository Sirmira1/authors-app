<div *ngIf="author; else notFound">
    <app-author-form
        [author]="author"
        mode="edit"
        [isSubmitting]="isSubmitting"
        [errorMessage]="errorMessage"
        (save)="saveAuthor($event)"
        (cancel)="goBack()">
    </app-author-form>
</div>
<ng-template #notFound>
    <p>Author not found.</p>
    <button (click)="goBack()">Back to Authors</button>
</ng-template>
