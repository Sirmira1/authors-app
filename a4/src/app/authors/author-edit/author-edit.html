<div *ngIf="author; else notFound">
    <h2>Edit Author</h2>
    <p class="form-error" [style.display]="errorMessage ? 'block' : 'none'">{{ errorMessage }}</p>
    <form #editForm="ngForm" (ngSubmit)="saveAuthor(editForm)">
        <div>
            <label for="auId">ID:</label>
            <input id="auId" [(ngModel)]="author.au_id" #auIdModel="ngModel" name="au_id" required pattern="^\d{3}-\d{2}-\d{4}$" placeholder="123-45-6789" [class.input-invalid]="showFieldError(auIdModel)" />
            <p class="field-error" *ngIf="showFieldError(auIdModel)">Incorrect format. Use 123-45-6789.</p>
        </div>
        <div>
            <label for="auFname">First Name:</label>
            <input id="auFname" [(ngModel)]="author.au_fname" #auFnameModel="ngModel" name="au_fname" required placeholder="e.g. Abraham" [class.input-invalid]="showFieldError(auFnameModel)" />
        </div>
        <div>
            <label for="auLname">Last Name:</label>
            <input id="auLname" [(ngModel)]="author.au_lname" #auLnameModel="ngModel" name="au_lname" required placeholder="e.g. Bennet" [class.input-invalid]="showFieldError(auLnameModel)" />
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input id="phone" [(ngModel)]="author.phone" #phoneModel="ngModel" name="phone" required placeholder="e.g. 415 658-9932" [class.input-invalid]="showFieldError(phoneModel)" />
        </div>
        <div>
            <label for="address">Address:</label>
            <input id="address" [(ngModel)]="author.address" #addressModel="ngModel" name="address" required placeholder="e.g. 55 Hillsdale Bl." [class.input-invalid]="showFieldError(addressModel)" />
        </div>
        <div>
            <label for="city">City:</label>
            <input id="city" [(ngModel)]="author.city" #cityModel="ngModel" name="city" required placeholder="e.g. Berkeley" [class.input-invalid]="showFieldError(cityModel)" />
        </div>
        <div>
            <label for="state">State:</label>
            <input id="state" [(ngModel)]="author.state" #stateModel="ngModel" name="state" required pattern="^[A-Za-z]{2}$" maxlength="2" placeholder="CA" [class.input-invalid]="showFieldError(stateModel)" />
            <p class="field-error" *ngIf="showFieldError(stateModel)">Incorrect format. Use a 2-letter code, for example CA.</p>
        </div>
        <div>
            <label for="zip">Zip:</label>
            <input id="zip" [(ngModel)]="author.zip" #zipModel="ngModel" name="zip" required pattern="^\d{5}$" maxlength="5" inputmode="numeric" placeholder="94705" [class.input-invalid]="showFieldError(zipModel)" />
            <p class="field-error" *ngIf="showFieldError(zipModel)">Incorrect format. Use 5 digits, for example 94705.</p>
        </div>
        <div>
            <label for="contract">Contract:</label>
            <input id="contract" type="checkbox" [(ngModel)]="author.contract" name="contract" />
        </div>
        <button type="submit" [disabled]="editForm.invalid">Save</button>
        <button type="button" routerLink="/authors">Cancel</button>
    </form>
</div>
<ng-template #notFound>
    <p>Author not found.</p>
    <button routerLink="/authors">Back to Authors</button>
</ng-template>
